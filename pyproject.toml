[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottlenecktest"
version = "0.1.0"
description = "BottleneckTest - Detect low-rank bottlenecks in stacked weight layers"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
